<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>天一か標識か − スワイプ仕分け</title>
<style>
  :root{
    --red:#d12e26;
    --asphalt:#23262b;
    --asphalt2:#2c3037;
    --lane:#e8d9a8;
    --ink:#f4f2ec;
    --ok:#39c172;
    --ng:#ff5252;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;}
  body{
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
    background:var(--asphalt);
    color:var(--ink);
    user-select:none;-webkit-user-select:none;
    touch-action:none;
  }
  #stage{
    position:fixed;inset:0;max-width:520px;margin:0 auto;
    background:
      radial-gradient(120% 60% at 50% 0%, rgba(255,190,80,.10), transparent 55%),
      radial-gradient(120% 70% at 50% 100%, rgba(0,0,0,.45), transparent 60%),
      repeating-linear-gradient(180deg, transparent 0 64px, rgba(255,255,255,.022) 64px 66px),
      linear-gradient(180deg, var(--asphalt2), var(--asphalt));
    overflow:hidden;
  }
  /* 道路の中央線 */
  #stage::before{
    content:"";position:absolute;left:50%;top:0;bottom:0;width:8px;transform:translateX(-50%);
    background:repeating-linear-gradient(180deg, var(--lane) 0 46px, transparent 46px 92px);
    opacity:.13;
  }

  /* ===== HUD ===== */
  #hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
    padding:calc(10px + env(safe-area-inset-top)) 16px 8px;z-index:5;}
  #score{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.02em;}
  #score small{font-size:12px;font-weight:600;opacity:.55;margin-left:4px;}
  #lives{font-size:20px;letter-spacing:2px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5));}
  #combo{position:absolute;top:64px;left:0;right:0;text-align:center;font-weight:800;font-size:15px;
    color:#ffd166;opacity:0;transition:opacity .2s;z-index:5;}
  #combo.show{opacity:1;}

  /* ===== 落下アイテム ===== */
  .item{position:absolute;left:50%;width:108px;height:108px;margin-left:-54px;top:0;will-change:transform;
    filter:drop-shadow(0 6px 14px rgba(0,0,0,.5));z-index:3;}
  .item svg{width:100%;height:100%;display:block;}
  .item.tenka img{width:100%;height:100%;object-fit:contain;display:block;}
  .tenkaMark{display:inline-flex;align-items:center;justify-content:center;}
  .tenkaMark img{width:100%;height:100%;object-fit:contain;}
  .tenkaMark svg{width:100%;height:100%;}
  .marks .tenkaMark{width:92px;height:92px;filter:drop-shadow(0 5px 12px rgba(0,0,0,.55));}
  .zone .tenkaMark{width:30px;height:30px;}
  .item.snap{transition:transform .15s ease-out;}
  .item.fly{transition:transform .38s cubic-bezier(.3,.6,.4,1), opacity .38s;}

  /* ===== 仕分け先ラベル ===== */
  #zones{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));
    display:flex;justify-content:space-between;padding:0 14px;z-index:4;pointer-events:none;}
  .zone{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.14);
    border-radius:14px;padding:8px 12px;backdrop-filter:blur(2px);transition:box-shadow .15s,border-color .15s;}
  .zone .arrow{font-size:18px;font-weight:800;opacity:.8;}
  .zone .name{font-size:13px;font-weight:800;line-height:1.25;}
  .zone .name span{display:block;font-size:10px;font-weight:600;opacity:.6;}
  .zone svg{width:30px;height:30px;}
  .zone.glow-ok{border-color:var(--ok);box-shadow:0 0 14px rgba(57,193,114,.5);}
  .zone.glow-ng{border-color:var(--ng);box-shadow:0 0 14px rgba(255,82,82,.5);}

  /* 判定ライン */
  #deadline{position:absolute;left:0;right:0;bottom:108px;height:2px;
    background:repeating-linear-gradient(90deg, rgba(255,255,255,.28) 0 10px, transparent 10px 20px);z-index:2;}

  /* ===== 判定ポップ ===== */
  .pop{position:absolute;left:50%;transform:translateX(-50%);font-size:30px;font-weight:900;z-index:6;
    text-shadow:0 2px 8px rgba(0,0,0,.6);animation:pop .6s ease-out forwards;pointer-events:none;white-space:nowrap;}
  .pop.ok{color:var(--ok);} .pop.ng{color:var(--ng);}
  @keyframes pop{0%{opacity:0;transform:translateX(-50%) scale(.6);}20%{opacity:1;transform:translateX(-50%) scale(1.15);}100%{opacity:0;transform:translateX(-50%) translateY(-46px) scale(1);}}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-7px);}75%{transform:translateX(7px);}}
  #stage.shake{animation:shake .25s;}

  /* ===== 画面(タイトル/ゲームオーバー) ===== */
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;
    gap:18px;padding:28px;background:rgba(15,17,20,.82);backdrop-filter:blur(3px);z-index:10;text-align:center;}
  .screen.hidden{display:none;}
  h1{font-size:30px;font-weight:900;line-height:1.3;letter-spacing:.04em;}
  h1 em{font-style:normal;color:#ffd166;}
  .marks{display:flex;gap:26px;margin:4px 0;}
  .marks figure{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .marks svg{width:92px;height:92px;filter:drop-shadow(0 5px 12px rgba(0,0,0,.55));}
  .marks figcaption{font-size:13px;font-weight:800;}
  .marks figcaption span{display:block;font-size:11px;font-weight:600;opacity:.6;margin-top:2px;}
  .howto{font-size:14px;line-height:1.9;opacity:.85;}
  .hint{font-size:12px;opacity:.6;line-height:1.7;}
  button{font:inherit;font-size:18px;font-weight:800;color:#1b1d21;background:#ffd166;border:none;
    border-radius:999px;padding:14px 44px;cursor:pointer;box-shadow:0 4px 0 #c79a3a;}
  button:active{transform:translateY(3px);box-shadow:0 1px 0 #c79a3a;}
  #finalScore{font-size:52px;font-weight:900;font-variant-numeric:tabular-nums;color:#ffd166;line-height:1;}
  #overStats{font-size:14px;opacity:.8;line-height:1.8;}
</style>
</head>
<body>
<div id="stage">
  <div id="hud">
    <div id="score">0<small>点</small></div>
    <div id="lives"></div>
  </div>
  <div id="combo"></div>
  <div id="deadline"></div>

  <div id="zones">
    <div class="zone" id="zoneL">
      <span class="arrow">←</span>
      <span class="tenkaMark" aria-hidden="true"></span>
      <div class="name">天下一品<span>こってり</span></div>
    </div>
    <div class="zone" id="zoneR">
      <div class="name" style="text-align:right">進入禁止<span>道路標識</span></div>
      <svg viewBox="0 0 100 100" aria-hidden="true"><use href="#g-sign"/></svg>
      <span class="arrow">→</span>
    </div>
  </div>

  <!-- タイトル -->
  <div class="screen" id="title">
    <h1>天一か、標識か。</h1>
    <div class="marks">
      <figure><span class="tenkaMark"></span><figcaption>天下一品<span>← 左へスワイプ</span></figcaption></figure>
      <figure><svg viewBox="0 0 100 100"><use href="#g-sign"/></svg><figcaption>進入禁止<span>右へスワイプ →</span></figcaption></figure>
    </div>
    <p class="howto">上から流れてくるマークを<br><b>左右にスワイプ</b>して仕分けよう。<br>下のラインを越えたらミス!</p>
    <p class="hint">見分け方:天一は棒の端が筆っぽく丸い。標識は棒がカクッとした四角。<br>⚠ 20個目からラッシュタイム:回転しながら次々降ってくる!</p>
    <button id="btnStart">スタート</button>
  </div>

  <!-- ゲームオーバー -->
  <div class="screen hidden" id="over">
    <h1>営業終了</h1>
    <div id="finalScore">0</div>
    <p id="overStats"></p>
    <div class="marks">
      <figure><span class="tenkaMark"></span><figcaption>天下一品</figcaption></figure>
      <figure><svg viewBox="0 0 100 100"><use href="#g-sign"/></svg><figcaption>進入禁止</figcaption></figure>
    </div>
    <button id="btnRetry">もう一杯</button>
  </div>
</div>

<!-- ===== マーク定義(色味は同一の赤で統一) ===== -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <!-- 天下一品風:フチなし・筆書きの丸い棒(わずかに傾く) -->
    <g id="g-tenka">
      <circle cx="50" cy="50" r="48" fill="#d12e26"/>
      <g transform="rotate(-2 50 50)">
        <path fill="#fbf7ef" d="M19,50
          q0.6,-8.4 10,-9.6
          q21,-2.8 42,0
          q9.4,1.2 10,9.6
          q-0.6,8.4 -10,9.6
          q-21,2.8 -42,0
          q-9.4,-1.2 -10,-9.6 z"/>
      </g>
    </g>
    <!-- 進入禁止風:白フチ・角ばった棒 -->
    <g id="g-sign">
      <circle cx="50" cy="50" r="48" fill="#d12e26"/>
      <rect x="14" y="41" width="72" height="18" fill="#ffffff"/>
    </g>
  </defs>
</svg>

  const tenkaHTML = () => `<img src="${TENKA_URL}" alt="天下一品ロゴ" draggable="false">`;
  document.querySelectorAll('.tenkaMark').forEach(s => { s.innerHTML = tenkaHTML(); });

  /* ===== 難易度カーブ =====
     30個目からラッシュ:出現間隔がどんどん短くなり、マークが回転する。
     50〜70個目あたりで限界が来る調整。 */
  const RUSH_AT = 20;
  const speedFor = n => {                                            // 落下px/s
    if (n < 20) return 150 + n * 8;                                  // 〜19個目:じわじわ
    if (n < 50) return 310 + (n - 20) * 2.5;                         // 20〜49個目:ラッシュ
    return Math.min(650, 385 + (n - 50) * 6);                        // 50個目〜:急加速
  };
  const intervalFor = n => Math.max(260, 1200 - (n - RUSH_AT) * 18); // 出現間隔ms(70個目で約300ms)
  const spinFor     = n => n < RUSH_AT ? 0 : Math.min(320, 90 + (n - RUSH_AT) * 4); // 回転deg/s

  let state = 'title';
  let score = 0, best = 0, lives = 3, combo = 0, maxCombo = 0, correct = 0, total = 0;
  let spawned = 0;
  let items = [];
  let dragItem = null;
  let spawnTimer = 0;
  let lastT = 0;

  const deadlineY = () => stage.clientHeight - 108 - 54;
  const lowest = () => items.reduce((a, b) => (!b.resolved && (!a || b.y > a.y)) ? b : a, null);

  function setHUD(){
    elScore.innerHTML = `${score}<small>点・${spawned}個目</small>`;
    elLives.textContent = '🍜'.repeat(lives) + '・'.repeat(Math.max(0, 3 - lives));
    if (combo >= 2){ elCombo.textContent = combo + ' COMBO!'; elCombo.classList.add('show'); }
    else elCombo.classList.remove('show');
  }

  function spawn(){
    if (state !== 'play') return;
    spawned++;
    const n = spawned;
    const type = Math.random() < 0.5 ? TYPES.TENKA : TYPES.SIGN;
    const el = document.createElement('div');
    el.className = 'item' + (type === TYPES.TENKA ? ' tenka' : '');
    el.innerHTML = type === TYPES.TENKA
      ? tenkaHTML()
      : `<svg viewBox="0 0 100 100"><use href="#g-sign"/></svg>`;
    stage.appendChild(el);
    const spin = spinFor(n);
    const it = {
      el, type, n,
      y: -140,
      x: n >= RUSH_AT ? (Math.random() * 160 - 80) : 0,   // ラッシュ中は横位置もばらす
      rot: n >= RUSH_AT ? Math.random() * 360 : (Math.random() * 8 - 4),
      rotSpeed: spin ? (Math.random() < 0.5 ? -1 : 1) * spin : 0,
      speed: speedFor(n),
      resolved: false, dragging: false,
      startX: 0, lastX: 0, lastTime: 0, vx: 0,
    };
    items.push(it);
    paint(it);
    if (n === RUSH_AT) showPop('⚠ ラッシュタイム!', false, 170);
    if (n >= RUSH_AT) spawnTimer = setTimeout(spawn, intervalFor(n)); // 出現間隔がどんどん短く
    setHUD();
  }

  function paint(it){
    it.el.style.transform =
      `translate(${it.x}px, ${it.y}px) rotate(${it.rot + it.x * 0.06}deg)`;
  }

  function loop(t){
    requestAnimationFrame(loop);
    const dt = Math.min(0.05, (t - lastT) / 1000 || 0);
    lastT = t;
    if (state !== 'play') return;
    for (const it of items){
      if (it.resolved) continue;
      it.y += it.speed * dt;
      if (it.rotSpeed && !it.dragging) it.rot = (it.rot + it.rotSpeed * dt) % 360;
      paint(it);
      if (it.y >= deadlineY()) miss(it);
    }
  }

  function cleanup(it){
    if (dragItem === it) dragItem = null;
    setTimeout(() => { it.el.remove(); items = items.filter(x => x !== it); }, 400);
  }

  function resolve(it, dir){ // dir: -1 左 / 1 右
    if (!it || it.resolved) return;
    it.resolved = true; total++;
    const isCorrect = (dir < 0 && it.type === TYPES.TENKA) || (dir > 0 && it.type === TYPES.SIGN);
    it.el.classList.remove('snap');
    it.el.classList.add('fly');
    it.el.style.transform = `translate(${dir * (stage.clientWidth * 0.9)}px, ${it.y - 40}px) rotate(${it.rot + dir * 60}deg)`;
    it.el.style.opacity = '0';
    cleanup(it);

    const zone = dir < 0 ? zoneL : zoneR;
    if (isCorrect){
      correct++; combo++; maxCombo = Math.max(maxCombo, combo);
      score += 100 * Math.min(5, 1 + Math.floor(combo / 5));
      showPop('正解!', true, it.y);
      zone.classList.add('glow-ok'); setTimeout(() => zone.classList.remove('glow-ok'), 250);
      setHUD();
      afterResolve(false);
    } else {
      fail(it.type === TYPES.TENKA ? 'それ天一!' : 'それ標識!', zone, it.y);
    }
  }

  function miss(it){
    if (it.resolved) return;
    it.resolved = true; total++;
    it.el.classList.add('fly');
    it.el.style.opacity = '0';
    cleanup(it);
    fail('落ちた…', null, deadlineY() - 30);
  }

  function fail(msg, zone, y){
    combo = 0; lives--;
    showPop(msg, false, Math.min(y, deadlineY() - 30));
    stage.classList.add('shake'); setTimeout(() => stage.classList.remove('shake'), 260);
    if (zone){ zone.classList.add('glow-ng'); setTimeout(() => zone.classList.remove('glow-ng'), 300); }
    setHUD();
    if (lives <= 0){ setTimeout(gameOver, 450); return; }
    afterResolve(true);
  }

  // ラッシュ前(〜29個目)は盤面が空いたら次を出す。ラッシュ中はタイマーが回り続ける。
  function afterResolve(failed){
    if (state !== 'play' || spawned >= RUSH_AT) return;
    setTimeout(() => {
      if (state === 'play' && spawned < RUSH_AT && !items.some(x => !x.resolved)) spawn();
    }, failed ? 450 : 240);
  }

  function showPop(text, ok, y){
    const p = document.createElement('div');
    p.className = 'pop ' + (ok ? 'ok' : 'ng');
    p.textContent = text;
    p.style.top = Math.max(90, y + 30) + 'px';
    stage.appendChild(p);
    setTimeout(() => p.remove(), 650);
  }

  function clearBoard(){
    clearTimeout(spawnTimer);
    items.forEach(it => it.el.remove());
    items = [];
    dragItem = null;
  }

  function start(){
    clearBoard();
    score = 0; lives = 3; combo = 0; maxCombo = 0; correct = 0; total = 0; spawned = 0;
    state = 'play';
    scrTitle.classList.add('hidden');
    scrOver.classList.add('hidden');
    setHUD();
    spawn();
  }

  function gameOver(){
    state = 'over';
    clearBoard();
    best = Math.max(best, score);
    document.getElementById('finalScore').textContent = score + ' 点';
    const acc = total ? Math.round(correct / total * 100) : 0;
    document.getElementById('overStats').innerHTML =
      `${spawned}個目まで到達・正答率 ${acc}%(${correct}/${total})<br>最大 ${maxCombo} コンボ・ベスト ${best} 点`;
    scrOver.classList.remove('hidden');
  }

  /* ===== 入力(一番下のマークを操作) ===== */
  stage.addEventListener('pointerdown', e => {
    if (state !== 'play') return;
    const it = lowest();
    if (!it) return;
    dragItem = it;
    it.dragging = true;
    it.startX = e.clientX - it.x;
    it.lastX = e.clientX; it.lastTime = performance.now(); it.vx = 0;
    it.el.classList.remove('snap');
  });
  stage.addEventListener('pointermove', e => {
    const it = dragItem;
    if (state !== 'play' || !it || !it.dragging || it.resolved) return;
    const now = performance.now();
    const dtm = now - it.lastTime;
    if (dtm > 0) it.vx = (e.clientX - it.lastX) / dtm; // px/ms
    it.lastX = e.clientX; it.lastTime = now;
    it.x = e.clientX - it.startX;
    paint(it);
  });
  function endDrag(){
    const it = dragItem;
    if (!it) return;
    dragItem = null;
    if (state !== 'play' || !it.dragging || it.resolved) return;
    it.dragging = false;
    const TH = 70, VTH = 0.6;
    if (it.x < -TH || it.vx < -VTH) resolve(it, -1);
    else if (it.x > TH || it.vx > VTH) resolve(it, 1);
    else { it.x = 0; it.el.classList.add('snap'); paint(it); }
  }
  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', endDrag);

  window.addEventListener('keydown', e => {
    if (state !== 'play') return;
    if (e.key === 'ArrowLeft') resolve(lowest(), -1);
    if (e.key === 'ArrowRight') resolve(lowest(), 1);
  });

  document.getElementById('btnStart').addEventListener('click', start);
  document.getElementById('btnRetry').addEventListener('click', start);

  requestAnimationFrame(t => { lastT = t; requestAnimationFrame(loop); });
})();
</script>
